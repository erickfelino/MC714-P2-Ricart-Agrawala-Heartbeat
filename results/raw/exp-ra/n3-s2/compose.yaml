# Gerado por scripts/gen_compose.py (n=3, run_id=n3-s2)
services:
  counter:
    image: mc714-ra-hb:latest
    init: true
    command: ["python", "-m", "counter"]
    environment:
      COUNTER_ADDR: "counter:6000"
      LOG_DIR: "/logs"
    volumes:
      - type: bind
        source: "C:/Users/erick/Documents/MC714 - Sistemas Distribuidos/MC714-P2-Ricart-Agrawala-Heartbeat/results/raw/exp-ra/n3-s2/logs"
        target: /logs
  node1:
    image: mc714-ra-hb:latest
    init: true
    command: ["python", "-m", "node"]
    depends_on: [counter]
    environment:
      NODE_ID: "1"
      PEERS: "1@node1:5000,2@node2:5000,3@node3:5000"
      COUNTER_ADDR: "counter:6000"
      LOG_DIR: "/logs"
      RUN_ID: "n3-s2"
      SEED: "2"
      DURATION_S: "30.0"
      START_DELAY_S: "3"
      DRAIN_S: "5"
      REQ_INTERVAL_MS: "200"
      CS_DURATION_MS: "50"
      HB_INTERVAL_MS: "500"
      HB_TIMEOUT_MS: "2000"
      HB_CHECK_MS: "100"
      NET_DELAY_MS: "0"
      NET_JITTER_MS: "0"
      CONNECT_TIMEOUT_MS: "1000"
    volumes:
      - type: bind
        source: "C:/Users/erick/Documents/MC714 - Sistemas Distribuidos/MC714-P2-Ricart-Agrawala-Heartbeat/results/raw/exp-ra/n3-s2/logs"
        target: /logs
